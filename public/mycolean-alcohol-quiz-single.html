  <script>

// API Configuration
const API_BASE = (function() {
  try {
    const host = (location && location.hostname) ? location.hostname.toLowerCase() : '';
    if (host === 'joshcreative.test' || host.endsWith('.joshcreative.test')) {
      return '/api/quiz';
    }
    // Production API base - update this to your actual domain
    return 'https://joshcreative.co/api/quiz';
  } catch (_) {
    return '/api/quiz';
  }
})();

// Session management
let sessionUuid = null;
let startTime = Date.now();
let questionStartTime = Date.now();

// API helper functions
async function apiCall(endpoint, method = 'GET', data = null) {
  const options = {
    method,
    headers: {
      'Content-Type': 'application/json',
      'Accept': 'application/json',
    },
  };
  
  if (data) {
    options.body = JSON.stringify(data);
  }
  
  try {
    const response = await fetch(`${API_BASE}${endpoint}`, options);
    if (!response.ok) {
      throw new Error(`API Error: ${response.status}`);
    }
    return await response.json();
  } catch (error) {
    console.error('API call failed:', error);
    throw error;
  }
}

async function startQuizSession() {
  try {
    const shopifyDomain = getShopifyDomain();
    const result = await apiCall('/start', 'POST', {
      quiz_type: 'audit',
      shopify_domain: shopifyDomain,
      referrer_url: document.referrer || window.location.href,
      session_metadata: {
        user_agent: navigator.userAgent,
        screen_resolution: `${screen.width}x${screen.height}`,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      }
    });
    sessionUuid = result.session_uuid;
    console.log('Quiz session started:', sessionUuid);
  } catch (error) {
    console.error('Failed to start quiz session:', error);
    // Continue with local-only mode
  }
}

async function saveDemographics(demographics) {
  if (!sessionUuid) return;
  try {
    await apiCall('/demographics', 'POST', {
      session_uuid: sessionUuid,
      demographics: demographics
    });
  } catch (error) {
    console.error('Failed to save demographics:', error);
  }
}

async function saveResponse(questionId, score) {
  if (!sessionUuid) return;
  try {
    const timeOnQuestion = Math.round((Date.now() - questionStartTime) / 1000);
    await apiCall('/response', 'POST', {
      session_uuid: sessionUuid,
      question_id: questionId,
      score: score,
      time_on_question: timeOnQuestion
    });
  } catch (error) {
    console.error('Failed to save response:', error);
  }
}

async function completeQuiz(responses) {
  if (!sessionUuid) return null;
  try {
    return await apiCall('/complete', 'POST', {
      session_uuid: sessionUuid,
      responses: responses
    });
  } catch (error) {
    console.error('Failed to complete quiz:', error);
    return null;
  }
}

async function trackEvent(eventType, questionId = null, eventData = {}) {
  if (!sessionUuid) return;
  try {
    await apiCall('/track', 'POST', {
      session_uuid: sessionUuid,
      event_type: eventType,
      question_id: questionId,
      event_data: eventData
    });
  } catch (error) {
    console.error('Failed to track event:', error);
  }
}

function getShopifyDomain() {
  try {
    const hostname = window.location.hostname;
    if (hostname.includes('myshopify.com')) {
      return hostname;
    }
    // Check if we're in a Shopify environment
    if (window.Shopify && window.Shopify.shop) {
      return window.Shopify.shop;
    }
    // Check for custom domains mapped to Shopify
    if (window.location.href.includes('shopify')) {
      return hostname;
    }
  } catch (_) {}
  return null;
}

// Add Shopify-specific styling and behavior
function initShopifyIntegration() {
  const isShopify = getShopifyDomain() !== null;
  
  if (isShopify) {
    // Add Shopify-specific CSS class
    const quizApp = document.getElementById('mycolean-quiz-app');
    if (quizApp) {
      quizApp.classList.add('shopify-embedded');
    }
    
    // Track Shopify-specific events
    trackEvent('shopify_integration_loaded', null, {
      domain: getShopifyDomain(),
      referrer: document.referrer,
      user_agent: navigator.userAgent
    });
    
    // Add Shopify store branding if available
    if (window.Shopify && window.Shopify.theme) {
      trackEvent('shopify_theme_detected', null, {
        theme_id: window.Shopify.theme.id,
        theme_name: window.Shopify.theme.name
      });
    }
  }
}

function riskFrom(score, demographics = {}){
  const gender = demographics.sex || null;
  
  if(score <= 7) {
    let message = score === 0 
      ? "Excellent! You appear to be alcohol-free or drink very rarely. This is the healthiest approach."
      : "Your drinking pattern suggests low risk for alcohol-related harm. Continue to stay within recommended guidelines.";
    return {label:"Low Risk", color:"#059669", text: message};
  }
  
  if(score <= 15) {
    let message = "Your score indicates increasing risk for alcohol-related harm. ";
    message += score >= 12 
      ? "Consider reducing your alcohol intake significantly. "
      : "Consider cutting down on your drinking. ";
    message += "Try having 2-3 alcohol-free days per week and avoid binge drinking.";
    return {label:"Increasing Risk", color:"#ca8a04", text: message};
  }
  
  if(score <= 19) {
    return {
      label:"Higher Risk", 
      color:"#dc2626", 
      text:"Your score indicates higher risk for alcohol-related problems. It's recommended to reduce your drinking and consider speaking with a healthcare professional about your alcohol use. You may benefit from brief counseling or support."
    };
  }
  
  let message = "Your score suggests possible alcohol dependence. ";
  message += score >= 30 
    ? "This indicates severe alcohol problems. Please seek professional help immediately from a doctor, counselor, or addiction specialist."
    : "It's important to speak with a healthcare professional who can provide proper assessment and support. Treatment options are available and effective.";
    
  return {label:"Possible Dependence", color:"#7f1d1d", text: message};
}

  }

  $("#back").onclick = () => { if(index>0) index--; render(); };
  $("#next").onclick = () => next();
}

async function next(){
  const step = QUIZ[index];
  
  if(step.type === "gate"){
    if(!document.getElementById("over18").checked){ 
      alert("Please confirm you are 18+ to continue."); 
      return; 
    }
    // Start quiz session when user confirms age
    await startQuizSession();
    await trackEvent('age_confirmed');
  }
  
  if(step.type === "demographics"){
    const sex = (document.querySelector('input[name="sex"]:checked')||{}).value;
    const age = (document.querySelector('input[name="age"]:checked')||{}).value;
    const email = document.getElementById('userEmail')?.value?.trim() || null;
    
    userMeta.sex = sex||null; 
    userMeta.age = age||null;
    userMeta.email = email;
    
    // Update session with email if provided
    if (email && sessionUuid) {
      try {
        await apiCall('/update-email', 'POST', {
          session_uuid: sessionUuid,
          user_email: email
        });
      } catch (error) {
        console.error('Failed to update email:', error);
      }
    }
    
    // Save demographics to API
    await saveDemographics(userMeta);
    await trackEvent('demographics_completed', null, {
      ...userMeta,
      email_provided: !!email
    });
  }
  
  if(step.type === "audit"){
    const picked = document.querySelector(`input[name="q${step.id}"]:checked`);
    if(!picked){ 
      alert("Please choose an option to continue."); 
      return; 
    }
    const score = Number(picked.value);
    responses[step.id] = score;
    
    // Save individual response to API
    await saveResponse(step.id, score);
    await trackEvent('question_answered', `audit_q${step.id}`, {
      question_id: step.id,
      score: score,
      option_selected: picked.parentElement.textContent.trim()
    });
  }
  
  if(index < QUIZ.length-1){ 
    index++; 
    questionStartTime = Date.now(); // Reset timer for next question
    render(); 
  } else { 
    await showResults(); 
  }
}
