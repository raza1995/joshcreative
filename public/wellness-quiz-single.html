<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Assessment</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .brand {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .brand h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .brand .subtitle {
            opacity: 0.9;
            font-size: 1rem;
        }

        .progress-container {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
        }

        .progress-bar {
            background: #e9ecef;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.9rem;
            color: #6c757d;
            text-align: center;
        }

        .content {
            padding: 40px;
        }

        .question-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
        }

        .option:hover {
            border-color: #667eea;
            background: #f7fafc;
        }

        .option input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.2);
        }

        .option.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .demographics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .demo-group {
            display: flex;
            flex-direction: column;
        }

        .demo-label {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .email-group {
            grid-column: 1 / -1;
            margin-bottom: 20px;
        }

        .email-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s ease;
        }

        .email-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .email-note {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 5px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: space-between;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .results {
            text-align: center;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 2rem;
            font-weight: 700;
            color: white;
        }

        .result-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .result-description {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #4a5568;
            margin-bottom: 30px;
        }

        .disclaimer {
            background: #f7fafc;
            border-left: 4px solid #667eea;
            padding: 15px 20px;
            margin: 20px 0;
            font-size: 0.9rem;
            color: #4a5568;
            border-radius: 0 8px 8px 0;
        }

        @media (max-width: 768px) {
            .demographics {
                grid-template-columns: 1fr;
            }
            
            .buttons {
                flex-direction: column;
            }
            
            .content {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="app"></div>
    </div>

    <script>
        // API Configuration
        const API_BASE = (function() {
            try {
                const host = (location && location.hostname) ? location.hostname.toLowerCase() : '';
                if (host === 'joshcreative.test' || host.endsWith('.joshcreative.test')) {
                    return '/api/quiz';
                }
                return 'https://joshcreative.co/api/quiz';
            } catch (_) {
                return '/api/quiz';
            }
        })();

        // Session management
        let sessionUuid = null;
        let startTime = Date.now();
        let questionStartTime = Date.now();

        // Quiz data
        const QUIZ_TYPE = 'wellness';
        const QUIZ = [
            {type: "gate", title: "Welcome to Wellness Assessment"},
            {type: "demographics", title: "Tell us about yourself"},
            {type: "wellness", id: 1, title: "How would you rate your overall physical health?", options: [
                {label: "Excellent", score: 4},
                {label: "Good", score: 3},
                {label: "Fair", score: 2},
                {label: "Poor", score: 1},
                {label: "Very Poor", score: 0}
            ]},
            {type: "wellness", id: 2, title: "How often do you exercise or engage in physical activity?", options: [
                {label: "Daily", score: 4},
                {label: "4-6 times per week", score: 3},
                {label: "2-3 times per week", score: 2},
                {label: "Once a week or less", score: 1},
                {label: "Never", score: 0}
            ]},
            {type: "wellness", id: 3, title: "How would you describe your stress levels?", options: [
                {label: "Very low stress", score: 4},
                {label: "Low stress", score: 3},
                {label: "Moderate stress", score: 2},
                {label: "High stress", score: 1},
                {label: "Very high stress", score: 0}
            ]},
            {type: "wellness", id: 4, title: "How many hours of sleep do you typically get per night?", options: [
                {label: "8+ hours", score: 4},
                {label: "7-8 hours", score: 3},
                {label: "6-7 hours", score: 2},
                {label: "5-6 hours", score: 1},
                {label: "Less than 5 hours", score: 0}
            ]},
            {type: "wellness", id: 5, title: "How satisfied are you with your work-life balance?", options: [
                {label: "Very satisfied", score: 4},
                {label: "Satisfied", score: 3},
                {label: "Neutral", score: 2},
                {label: "Dissatisfied", score: 1},
                {label: "Very dissatisfied", score: 0}
            ]}
        ];

        const ageBrackets = ['18-24', '25-34', '35-44', '45-54', '55-64', '65+'];

        let index = 0;
        const responses = {};
        const meta = {};

        // API helper functions
        async function apiCall(endpoint, method = 'GET', data = null) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                },
            };
            
            if (data) {
                options.body = JSON.stringify(data);
            }
            
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, options);
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error('API call failed:', error);
                throw error;
            }
        }

        async function startQuizSession() {
            try {
                const result = await apiCall('/start', 'POST', {
                    quiz_type: QUIZ_TYPE,
                    referrer_url: document.referrer || window.location.href,
                    session_metadata: {
                        user_agent: navigator.userAgent,
                        screen_resolution: `${screen.width}x${screen.height}`,
                        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    }
                });
                sessionUuid = result.session_uuid;
                console.log('Quiz session started:', sessionUuid);
            } catch (error) {
                console.error('Failed to start quiz session:', error);
            }
        }

        async function saveDemographics(demographics) {
            if (!sessionUuid) return;
            try {
                await apiCall('/demographics', 'POST', {
                    session_uuid: sessionUuid,
                    demographics: demographics
                });
            } catch (error) {
                console.error('Failed to save demographics:', error);
            }
        }

        async function saveResponse(questionId, score) {
            if (!sessionUuid) return;
            try {
                const timeOnQuestion = Math.round((Date.now() - questionStartTime) / 1000);
                await apiCall('/response', 'POST', {
                    session_uuid: sessionUuid,
                    question_id: questionId,
                    score: score,
                    time_on_question: timeOnQuestion
                });
            } catch (error) {
                console.error('Failed to save response:', error);
            }
        }

        async function completeQuiz(responses) {
            if (!sessionUuid) return null;
            try {
                return await apiCall('/complete', 'POST', {
                    session_uuid: sessionUuid,
                    responses: responses
                });
            } catch (error) {
                console.error('Failed to complete quiz:', error);
                return null;
            }
        }

        function wellnessFrom(score) {
            if (score >= 16) return {label: "Excellent Wellness", color: "#059669", text: "Outstanding! You're maintaining excellent wellness habits. Keep up the great work!"};
            if (score >= 12) return {label: "Good Wellness", color: "#10b981", text: "Great job! You have good wellness habits with room for minor improvements."};
            if (score >= 8) return {label: "Fair Wellness", color: "#ca8a04", text: "You're doing okay, but there's significant room for improvement in your wellness routine."};
            if (score >= 4) return {label: "Poor Wellness", color: "#dc2626", text: "Your wellness needs attention. Consider making some positive lifestyle changes."};
            return {label: "Very Poor Wellness", color: "#7f1d1d", text: "Your wellness requires immediate attention. Consider consulting with a healthcare professional."};
        }

        function $(sel) { return document.querySelector(sel); }

        function render() {
            const container = $("#app");
            const step = QUIZ[index];
            const totalSteps = QUIZ.filter(q => q.type === 'wellness').length;
            const currentWellnessIdx = Math.max(0, QUIZ.slice(0, index + 1).filter(q => q.type === 'wellness').length);

            let progressPct = Math.round((currentWellnessIdx / totalSteps) * 100);

            let html = `
                <div class="card">
                    <div class="brand">
                        <h1><i class="fas fa-heart"></i> Wellness Assessment</h1>
                        <div class="subtitle">Discover your wellness level in 5 simple questions</div>
                    </div>
            `;

            if (step.type !== "gate") {
                html += `
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progressPct}%"></div>
                        </div>
                        <div class="progress-text">Question ${currentWellnessIdx} of ${totalSteps}</div>
                    </div>
                `;
            }

            html += `<div class="content">`;

            if (step.type === "gate") {
                html += `
                    <div style="text-align: center;">
                        <h2 style="margin-bottom: 20px; color: #2d3748;">Ready to assess your wellness?</h2>
                        <p style="margin-bottom: 30px; color: #4a5568; font-size: 1.1rem;">
                            This quick 5-question assessment will help you understand your current wellness level across key areas of health and lifestyle.
                        </p>
                        <div class="disclaimer">
                            <strong>Privacy Notice:</strong> Your responses are completely confidential and will be used only to provide you with personalized wellness insights.
                        </div>
                    </div>
                `;
            } else if (step.type === "demographics") {
                html += `
                    <h2 class="question-title">Tell us a bit about yourself</h2>
                    
                    <div class="email-group">
                        <label class="demo-label">Email (optional)</label>
                        <input type="email" id="userEmail" class="email-input" placeholder="your.email@example.com">
                        <div class="email-note">We'll only use this to send you wellness tips. You can skip this field.</div>
                    </div>
                    
                    <div class="demographics">
                        <div class="demo-group">
                            <div class="demo-label">Age Group</div>
                            <div class="options" id="age">
                                ${ageBrackets.map(b => `<label class="option"><input type="radio" name="age" value="${b}"> ${b}</label>`).join('')}
                            </div>
                        </div>
                        
                        <div class="demo-group">
                            <div class="demo-label">Gender (optional)</div>
                            <div class="options" id="sex">
                                <label class="option"><input type="radio" name="sex" value="female"> Female</label>
                                <label class="option"><input type="radio" name="sex" value="male"> Male</label>
                                <label class="option"><input type="radio" name="sex" value="other"> Prefer not to say</label>
                            </div>
                        </div>
                    </div>
                `;
            } else if (step.type === "wellness") {
                html += `
                    <h2 class="question-title">${step.title}</h2>
                    <div class="options">
                        ${step.options.map(opt => `
                            <label class="option">
                                <input type="radio" name="q${step.id}" value="${opt.score}">
                                ${opt.label}
                            </label>
                        `).join('')}
                    </div>
                `;
            }

            html += `
                    <div class="buttons">
                        <button class="btn btn-secondary" id="back" ${index === 0 ? 'style="visibility:hidden"' : ''}>
                            <i class="fas fa-arrow-left"></i> Back
                        </button>
                        <button class="btn btn-primary" id="next">
                            ${index < QUIZ.length - 1 ? 'Next <i class="fas fa-arrow-right"></i>' : 'Get Results <i class="fas fa-check"></i>'}
                        </button>
                    </div>
                </div>
            </div>
            `;

            container.innerHTML = html;

            // Add event listeners
            $("#back").onclick = () => { if (index > 0) index--; render(); };
            $("#next").onclick = () => next();

            // Add option selection styling
            document.querySelectorAll('.option').forEach(option => {
                option.addEventListener('click', function() {
                    const radio = this.querySelector('input[type="radio"]');
                    if (radio) {
                        radio.checked = true;
                        
                        // Remove selected class from siblings
                        this.parentNode.querySelectorAll('.option').forEach(opt => {
                            opt.classList.remove('selected');
                        });
                        
                        // Add selected class to this option
                        this.classList.add('selected');
                    }
                });
            });
        }

        async function next() {
            const step = QUIZ[index];

            if (step.type === "gate") {
                await startQuizSession();
            }

            if (step.type === "demographics") {
                const age = (document.querySelector('input[name="age"]:checked') || {}).value;
                const sex = (document.querySelector('input[name="sex"]:checked') || {}).value;
                const email = document.getElementById('userEmail')?.value?.trim() || null;

                if (!age) {
                    alert("Please select your age group to continue.");
                    return;
                }

                meta.age = age;
                meta.sex = sex || null;
                meta.email = email;

                // Update session with email if provided
                if (email && sessionUuid) {
                    try {
                        await apiCall('/update-email', 'POST', {
                            session_uuid: sessionUuid,
                            user_email: email
                        });
                    } catch (error) {
                        console.error('Failed to update email:', error);
                    }
                }

                await saveDemographics(meta);
            }

            if (step.type === "wellness") {
                const picked = document.querySelector(`input[name="q${step.id}"]:checked`);
                if (!picked) {
                    alert("Please choose an option to continue.");
                    return;
                }
                const score = Number(picked.value);
                responses[step.id] = score;

                await saveResponse(step.id, score);
            }

            if (index < QUIZ.length - 1) {
                index++;
                questionStartTime = Date.now();
                render();
            } else {
                await showResults();
            }
        }

        async function showResults() {
            const sum = Object.values(responses).reduce((a, b) => a + b, 0);
            let wellness = wellnessFrom(sum);
            let serverResults = false;

            // Complete quiz via API and get server-side results
            try {
                const apiResult = await completeQuiz(responses);
                if (apiResult && apiResult.risk_label) {
                    wellness = {
                        label: apiResult.risk_label,
                        color: apiResult.risk_color,
                        text: apiResult.risk_message
                    };
                    serverResults = true;
                }
            } catch (error) {
                console.error('Failed to complete quiz via API, using local results:', error);
            }

            const container = $("#app");
            container.innerHTML = `
                <div class="card">
                    <div class="brand">
                        <h1><i class="fas fa-heart"></i> Your Wellness Results</h1>
                        <div class="subtitle">Based on your responses</div>
                    </div>
                    <div class="content results">
                        <div class="score-circle" style="background: ${wellness.color}">
                            ${sum}/20
                        </div>
                        <h2 class="result-title" style="color: ${wellness.color}">${wellness.label}</h2>
                        <p class="result-description">${wellness.text}</p>
                        
                        <div class="disclaimer">
                            <strong>DISCLAIMER:</strong> This is a wellness screening tool only, not medical advice. Your answers are completely private and confidential. For personalized health guidance, consult with a healthcare professional.
                        </div>
                        
                        <div class="buttons" style="justify-content: center; margin-top: 30px;">
                            <button class="btn btn-primary" onclick="location.reload()">
                                <i class="fas fa-redo"></i> Take Again
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            render();
        });
    </script>
</body>
</html>
